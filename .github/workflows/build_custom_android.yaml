name: Build custom Cromite Android (AO3 home + DoH)

on:
  push:
    branches:
      - custom/ao3-home-doh-android
  workflow_dispatch:
    inputs:
      target:
        description: 'android arch [arm/arm64/x64/all]'
        required: true
        default: 'arm64'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: custom/ao3-home-doh-android

      - name: Show environment
        run: |
          echo "Branch: $GITHUB_REF"
          uname -a
          lsb_release -a || true
          df -h || true

      - name: Add lock prefs files
        run: |
          echo "Files added in branch for AO3 homepage and DoH are already present."

      - name: Prepare simple Android build (placeholder)
        run: |
          echo "This workflow is a lightweight placeholder. Full Chromium build requires large images and custom runners."

      - name: Package dummy APK
        run: |
          mkdir -p out
          echo "placeholder for Cromite (AO3 home + DoH)" > out/README.txt
          if command -v zip >/dev/null 2>&1; then
            zip -r out/CustomCromite-unsigned.zip out/README.txt
          else
            apt-get update && apt-get install -y zip && zip -r out/CustomCromite-unsigned.zip out/README.txt
          fi

      - name: List output files
        run: |
          ls -la out || true

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: custom-cromite-android-placeholder
          path: out/CustomCromite-unsigned.zip
