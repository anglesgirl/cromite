name: Build AO3 Browser (arm64)

on:
  workflow_dispatch:
    inputs:
      force_build_images:
        description: 'Force build images from scratch? [true/false]'
        required: false
        default: 'false'

env:
  REMOVEDOCKERSUPPORT: true
  USELOCALIMAGE: true

jobs:
  build:
    name: Build Android arm64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/lib/jvm /usr/local/julia* \
            /usr/local/x86_64-linux-gnu /usr/local/gcc \
            /usr/local/llvm-* /usr/share/swift /usr/share/miniconda \
            /usr/share/az_* /usr/local/share/powershell
          sudo apt-get clean
          df -h

      - name: Get version and upstream SHA
        id: info
        shell: bash
        run: |
          VERSION=$(cat build/RELEASE)
          UPSTREAM_SHA=$(git ls-remote https://github.com/uazo/cromite HEAD | cut -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          echo "Upstream SHA: $UPSTREAM_SHA"

      - name: Download regctl
        shell: bash
        run: |
          curl -L https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 > regctl
          chmod 755 regctl
          sudo mv regctl /usr/local/bin/

      - name: Try pull prebuilt cromite-build image
        id: pull
        shell: bash
        run: |
          VERSION=${{ steps.info.outputs.version }}
          SHA=${{ steps.info.outputs.upstream_sha }}
          TAG="$VERSION-$SHA"
          echo "Trying uazo/cromite-build:$TAG"
          if docker pull "uazo/cromite-build:$TAG" 2>/dev/null; then
            docker tag "uazo/cromite-build:$TAG" uazo/cromite-build:build
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Pull success!"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "Pull failed, will build from scratch"
          fi

      - name: Build build-deps image
        if: steps.pull.outputs.found != 'true'
        shell: bash
        run: |
          VERSION=${{ steps.info.outputs.version }}
          DOCKER_BUILDKIT=1 docker build -t uazo/build-deps:$VERSION \
            --progress plain \
            --build-arg VERSION=$VERSION \
            --no-cache \
            tools/images/build-deps/.

      - name: Build chromium source image
        if: steps.pull.outputs.found != 'true'
        shell: bash
        run: |
          VERSION=${{ steps.info.outputs.version }}
          DOCKER_BUILDKIT=1 docker build -t uazo/chromium:$VERSION \
            --progress plain \
            --build-arg VERSION=$VERSION \
            --no-cache \
            tools/images/chr-source/.

      - name: Build cromite-source image
        if: steps.pull.outputs.found != 'true'
        shell: bash
        run: |
          VERSION=${{ steps.info.outputs.version }}
          SHA=${{ steps.info.outputs.upstream_sha }}
          DOCKER_BUILDKIT=1 docker build -t uazo/cromite:$VERSION-$SHA \
            --progress plain \
            --build-arg CROMITE_SHA=$SHA \
            --build-arg VERSION=$VERSION \
            --no-cache \
            tools/images/cromite-source/.

      - name: Build cromite-build image
        if: steps.pull.outputs.found != 'true'
        shell: bash
        run: |
          VERSION=${{ steps.info.outputs.version }}
          SHA=${{ steps.info.outputs.upstream_sha }}
          DOCKER_BUILDKIT=1 docker build -t uazo/cromite-build:$VERSION-$SHA \
            --progress plain \
            --build-arg CROMITE_SHA=$SHA \
            --build-arg VERSION=$VERSION \
            --no-cache \
            tools/images/cromite-build/.
          docker tag uazo/cromite-build:$VERSION-$SHA uazo/cromite-build:build

      - name: Verify image exists
        shell: bash
        run: |
          docker images | grep cromite
          docker inspect uazo/cromite-build:build > /dev/null && echo "Image OK" || { echo "Image missing!"; exit 1; }

      - name: Apply AO3 patches and build arm64 APK
        shell: bash
        run: |
          mkdir -p $HOME/build-output
          docker run --rm \
            -v "$(pwd)/ao3-browser:/ao3-browser:ro" \
            -v "$HOME/build-output:/home/lg/working_dir/chromium/src/out" \
            -e WORKSPACE=/home/lg/working_dir \
            -e HOME=/home/lg/working_dir \
            -e TARGET_ISDEBUG=false \
            uazo/cromite-build:build \
            bash -c '
              set -ex
              export PATH=$WORKSPACE/chromium/src/third_party/llvm-build/Release+Asserts/bin:$WORKSPACE/depot_tools/:/usr/local/go/bin:$WORKSPACE/mtool/bin:$PATH
              cd $WORKSPACE/chromium/src

              echo "========== Applying AO3 patches =========="
              for f in /ao3-browser/patches/*.patch; do
                echo " -> Applying $(basename $f)"
                cat "$f" | git am --no-verify || {
                  echo "git am failed, trying patch -p1..."
                  cd $WORKSPACE/chromium/src && patch -p1 < "$f"
                }
              done

              echo "========== Copying extension files =========="
              EXT_DIR=chrome/browser/extensions/default_extensions/ao3-translator
              mkdir -p "$EXT_DIR/assets"
              cp /ao3-browser/extension/manifest.json "$EXT_DIR/"
              cp /ao3-browser/extension/background.js "$EXT_DIR/"
              cp /ao3-browser/extension/gm-polyfill.js "$EXT_DIR/"
              cp /ao3-browser/extension/zh-cn.js "$EXT_DIR/"
              cp /ao3-browser/extension/ao3-chinese.user.js "$EXT_DIR/"
              cp /ao3-browser/extension/assets/* "$EXT_DIR/assets/"

              echo "========== Building arm64 =========="
              mkdir -p out/arm64

              gn gen --args="target_os = \"android\" $(cat $WORKSPACE/cromite/build/cromite.gn_args) target_cpu = \"arm64\"" out/arm64

              vpython3 $WORKSPACE/depot_tools/siso.py ninja -C out/arm64 chrome_public_apk --offline || \
              vpython3 $WORKSPACE/depot_tools/siso.py ninja -C out/arm64 chrome_public_apk

              echo "========== Build complete =========="
              ls -la out/arm64/apks/
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ao3-browser-arm64-apk
          path: ${{ env.HOME }}/build-output/arm64/apks/*.apk
          retention-days: 30

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ao3-browser-${{ steps.info.outputs.version }}
          files: ${{ env.HOME }}/build-output/arm64/apks/*.apk
          name: AO3 Browser ${{ steps.info.outputs.version }}
          body: |
            AO3 Browser 测试版

            基于 Cromite + Chromium ${{ steps.info.outputs.version }}

            功能:
            - 内置 Cloudflare Zero Trust DoH (绕过 DNS 封锁)
            - 强制启用 ECH (加密 ClientHello,绕过 SNI 审查)
            - 内置 AO3 Translator 翻译扩展 (汉化+多引擎翻译)
            - 默认搜索引擎为 AO3 站内搜索
            - 精简界面,移除与 AO3 无关的设置项
