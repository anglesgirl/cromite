name: Build AO3 Browser (arm64)

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'debug build? [true/false]'
        required: false
        default: 'false'

env:
  REMOVEDOCKERSUPPORT: true
  USELOCALIMAGE: true

jobs:
  build_arm64:
    name: Build Android arm64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 720
    steps:
      - name: Checkout cromite fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/lib/jvm /usr/local/julia* \
            /usr/local/x86_64-linux-gnu /usr/local/gcc \
            /usr/local/llvm-* /usr/share/swift /usr/share/miniconda \
            /usr/share/az_* /usr/local/share/powershell
          df -h

      - name: Get chromium version
        id: version
        shell: bash
        run: |
          VERSION=$(cat ./build/RELEASE)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Chromium version: $VERSION"

      - name: Setup build environment
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential git python3 curl wget lsb-release \
            libglib2.0-dev libnss3-dev pkg-config

      - name: Download regctl
        shell: bash
        run: |
          curl -L https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 > regctl
          chmod 755 regctl
          sudo mv regctl /usr/local/bin/

      - name: Pull build docker image
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # 查找对应的 cromite-build docker 镜像
          IMAGE="uazo/cromite-build:$VERSION"
          echo "Pulling $IMAGE"
          docker pull "$IMAGE" || echo "Image not found, will use latest"
          docker tag "$IMAGE" cromite-build:latest 2>/dev/null || true

      - name: Apply AO3 Browser patches
        shell: bash
        run: |
          # 补丁已在仓库的 ao3-browser/ 目录中
          cd /tmp
          git clone --depth 1 https://github.com/uazo/cromite.git cromite-src 2>/dev/null || true

          # 在 docker 容器内应用补丁
          docker run --rm \
            -v "$(pwd)/ao3-browser:/ao3-browser" \
            -v "$HOME/chromium:/home/lg/working_dir" \
            -e "WORKSPACE=/home/lg/working_dir" \
            cromite-build:latest \
            bash -c '
              cd /home/lg/working_dir/chromium/src
              bash /ao3-browser/apply-ao3-patches.sh
            '

      - name: Build arm64 APK
        shell: bash
        run: |
          DEBUG="${{ github.event.inputs.debug }}"
          docker run --rm \
            -v "$HOME/chromium:/home/lg/working_dir" \
            -e "WORKSPACE=/home/lg/working_dir" \
            -e "TARGET_ISDEBUG=$DEBUG" \
            cromite-build:latest \
            bash -c "
              export PATH=\$WORKSPACE/chromium/src/third_party/llvm-build/Release+Asserts/bin:\$WORKSPACE/depot_tools/:\$PATH
              export HOME=/home/lg/working_dir
              cd \$HOME/chromium/src

              # 只构建 arm64
              target_cpu=arm64

              gn gen out/Release --args='target_os=\"android\" target_cpu=\"arm64\" is_official_build=true is_debug=false chrome_pgo_phase=0 is_high_end_android=true'

              autoninja -C out/Release chrome_public_apk
            "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ao3-browser-arm64-apk
          path: ${{ env.HOME }}/chromium/src/out/Release/apks/*.apk
          retention-days: 30

      - name: Create release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ao3-browser-${{ steps.version.outputs.version }}
          files: ${{ env.HOME }}/chromium/src/out/Release/apks/*.apk
          name: AO3 Browser ${{ steps.version.outputs.version }}
          body: |
            AO3 Browser 测试版

            基于 Cromite + Chromium ${{ steps.version.outputs.version }}

            功能:
            - 内置 Cloudflare Zero Trust DoH (绕过 DNS 封锁)
            - 强制启用 ECH (加密 ClientHello,绕过 SNI 审查)
            - 内置 AO3 Translator 翻译扩展 (汉化+多引擎翻译)
            - 默认搜索引擎为 AO3 站内搜索
            - 精简界面,移除与 AO3 无关的设置项
